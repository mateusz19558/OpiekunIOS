name: Build iOS IPA (Automated Cloud Mac)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show Xcode Version
        run: xcodebuild -version

      - name: Build Project without Code Signing
        run: |
          xcodebuild clean build \
            -project OpiekunIOS.xcodeproj \
            -scheme OpiekunIOS \
            -configuration Release \
            -destination "generic/platform=iOS" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            CONFIGURATION_BUILD_DIR=build/Output

      - name: Package .app into .ipa
        run: |
          mkdir -p build/Payload
          cp -r build/Output/OpiekunIOS.app build/Payload/
          cd build
          zip -r OpiekunPC.ipa Payload
          echo "Plik OpiekunPC.ipa zostal pomyslnie utworzony!"

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: OpiekunPC-iOS-IPA
          path: build/OpiekunPC.ipa
